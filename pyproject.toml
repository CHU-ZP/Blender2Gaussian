[project]
name = "mesh-to-gs"
version = "0.1.0"
description = "Batch training of surface-bound SH0 Gaussians from Blender scenes"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bpy==5.2.2",
    "ninja>=1.11,<2",
    "numpy>=2.1,<3",
    "OpenEXR>=3.3,<4",
    "packaging>=24,<27",
    "pillow>=11,<13",
    "plyfile>=1.1,<2",
    "scipy>=1.15,<2",
    "setuptools>=75,<81",
    "torch==2.11.0",
    "warp-lang>=1.8,<2",
    "wheel>=0.45,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]
render = [
    "gsplat==1.5.3",
]

[build-system]
requires = ["setuptools>=75,<81", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.setuptools]
packages = ["mesh_to_gs"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pypi-mirror"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
